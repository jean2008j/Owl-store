<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OWL STORE</title>
    <meta name="description" content="OWL STORE — heavyweight streetwear. New drops, hoodies, tees, and sets. Sham Cash and local shipping." />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&family=Cairo:wght@400;600;700&display=swap" />
  <script>
      try {
        var t = JSON.parse(localStorage.getItem("owl-store") || "{}").state;
        if (t && t.theme === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
